# FINZ v1 deployment blueprint — paid instance required for persistent SQLite storage.
services:
  - type: web
    name: finz-ai-studio
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: DEMO_MODE
        value: "0"
      - key: DATABASE_PATH
        value: /var/data/finz.sqlite3
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: finz-data
      mountPath: /var/data
      sizeGB: 1
